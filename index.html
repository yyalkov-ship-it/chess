<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Анализ">
<link rel="apple-touch-icon" href="/chess/icons/apple-touch-icon.png?v=2">
<link rel="icon" href="/chess/icons/icon-192.png?v=2">
<link rel="manifest" href="/chess/manifest.webmanifest">
<title>Шахматный анализ</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1b19; color: #e8e6e3; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  img { width: 72px; height: 72px; margin: 0 auto 4px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  input, button { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid #3d3b37; }
  input { background: #262522; color: inherit; }
  button { background: #6fa84b; border-color: #6fa84b; color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.4em; color: #a8a49c; font-size: 14px; }
  #msg.err { color: #e06c5a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <form id="f" hidden>
    <img src="/chess/icons/icon-192.png" alt="">
    <h1>Шахматный анализ</h1>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Открыть</button>
    <div id="msg"></div>
  </form>
  <div id="wait">Открываю…</div>
</main>
<script>
(() => {
  const BASE = '/chess/', APP = BASE + 'app/', V = '28159964bc73de95', ITER = 600000
  const CACHE = 'sealed-app-' + V
  const $ = (id) => document.getElementById(id)
  const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : '' }

  const idb = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('sealed', 1)
    r.onupgradeneeded = () => r.result.createObjectStore('k')
    r.onerror = () => rej(r.error)
    r.onsuccess = () => { const tx = r.result.transaction('k', mode); const q = fn(tx.objectStore('k')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error) }
  })
  const getKey = () => idb('readonly', (s) => s.get('key')).catch(() => null)
  const putKey = (k) => idb('readwrite', (s) => s.put(k, 'key')).catch(() => {})

  const target = () => {
    let n = new URLSearchParams(location.search).get('next')
    try { n = n || sessionStorage.getItem('sealed.next'); sessionStorage.removeItem('sealed.next') } catch (e) {}
    return n && n.startsWith(APP) ? n : APP + 'index.html'
  }
  const go = () => location.replace(target())

  let payload
  const fetchPayload = async () => {
    if (!payload) {
      const r = await fetch(BASE + 'payload-' + V + '.bin', { cache: 'no-cache' })
      if (!r.ok) throw new Error('Не удалось скачать приложение (' + r.status + ')')
      payload = new Uint8Array(await r.arrayBuffer())
    }
    return payload
  }
  const derive = async (pw, salt) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  }
  // ключ привязан к соли сборки; при новой сборке соль новая, поэтому храним пароль-производный ключ вместе с солью
  const decrypt = async (key, data) => new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.subarray(16, 28) }, key, data.subarray(28)))

  const install = async (gz) => {
    const plain = new Uint8Array(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())
    const hl = new DataView(plain.buffer).getUint32(0)
    const index = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + hl)))
    const body = 4 + hl
    const cache = await caches.open(CACHE)
    await Promise.all(index.map((f) => cache.put(new Request(location.origin + APP + f.p), new Response(plain.slice(body + f.o, body + f.o + f.n), { headers: { 'Content-Type': f.t } }))))
    for (const k of await caches.keys()) if (k.startsWith('sealed-app-') && k !== CACHE) await caches.delete(k)
    try { localStorage.setItem('sealed.v', V) } catch (e) {}
    try { await navigator.storage.persist() } catch (e) {}
  }

  const ready = async () => {
    if (!('serviceWorker' in navigator)) throw new Error('Браузер не поддерживает офлайн-режим. Откройте в Safari.')
    await navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE })
    await navigator.serviceWorker.ready
  }

  const showForm = (t, err) => { $('wait').hidden = true; $('f').hidden = false; say(t || '', err); $('pw').focus() }

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault()
    $('go').disabled = true; say('Проверяю пароль…')
    try {
      const data = await fetchPayload()
      const salt = data.slice(0, 16)
      const key = await derive($('pw').value, salt)
      let gz
      try { gz = await decrypt(key, data) } catch (e) { throw new Error('Неверный пароль') }
      say('Устанавливаю…')
      await install(gz)
      await putKey({ key, salt: Array.from(salt).join(',') })
      go()
    } catch (err) { say(err.message, true); $('go').disabled = false; $('pw').select() }
  })

  ;(async () => {
    try {
      await ready()
      if (localStorage.getItem('sealed.v') === V && (await caches.has(CACHE))) return go()
      const saved = await getKey()
      if (saved) {
        $('wait').textContent = 'Обновляю приложение…'
        const data = await fetchPayload()
        if (saved.salt === Array.from(data.slice(0, 16)).join(',')) {
          try { await install(await decrypt(saved.key, data)); return go() } catch (e) {}
        }
      }
      showForm()
    } catch (err) { showForm(err.message, true) }
  })()
})()
</script>
</body>
</html>
